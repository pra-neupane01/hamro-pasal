spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hamro_pasal_DB}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: ${JWT_SECRET}
    expiry: ${JWT_EXPIRY}